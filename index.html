<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Will you be my Valentine?</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --pink1: #ffb6d9;
      --pink2: #ff8ec7;
      --pink3: #ff69b4;
      --glass: rgba(255, 255, 255, 0.45);
      --yes: #ff1f68;
      --yesHover: #e80056;
      --no: #ffffffbb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #ffe3f3, #ffc3d8, #ff9dc8);
      font-family: "Poppins", sans-serif;
      overflow: hidden;
      padding: 20px;
      position: relative;
    }

    /* FLOATING HEARTS */
    .floating-heart {
      position: absolute;
      color: #ff4d88;
      font-size: 22px;
      animation: floatUp 8s linear infinite;
      opacity: 0.6;
    }

    @keyframes floatUp {
      from { transform: translateY(100vh) scale(0.9); opacity: 0.3; }
      to { transform: translateY(-10vh) scale(1.3); opacity: 0; }
    }

    .card {
      width: min(720px, 92vw);
      padding: 30px 26px;
      background: var(--glass);
      backdrop-filter: blur(14px) saturate(180%);
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 25px 80px rgba(0,0,0,.18);
      border: 1px solid rgba(255,255,255,0.35);
      animation: fadeIn 1.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-size: clamp(32px, 5vw, 50px);
      margin: 14px 0 20px;
      color: #d40062;
      text-shadow: 0 2px 10px rgba(255,0,80,0.3);
    }

    .art {
      width: min(260px, 80vw);
      display: block;
      margin: 0 auto 15px;
      filter: drop-shadow(0 12px 18px rgba(0,0,0,.18));
    }

    .button-zone {
      margin-top: 10px;
      width: 100%;
      height: 160px;
      position: relative;
    }

    button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 16px 32px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 40px;
      border: none;
      cursor: pointer;
      transition: 0.25s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,.16);
    }

    #yesBtn {
      left: 20%;
      background: var(--yes);
      color: white;
      animation: heartbeat 1.5s infinite;
    }

    #yesBtn:hover {
      background: var(--yesHover);
      transform: translateY(-50%) scale(1.1);
    }

    @keyframes heartbeat {
      0%, 100% { transform: translateY(-50%) scale(1); }
      50% { transform: translateY(-50%) scale(1.08); }
    }

    #noBtn {
      left: 65%;
      background: var(--no);
      color: #333;
    }

    .hint {
      margin-top: 12px;
      font-size: 14px;
      opacity: 0.65;
      font-style: italic;
      color: #7a0040;
    }

    .result {
      display: none;
      margin-top: 20px;
      animation: popIn .45s ease;
    }

    @keyframes popIn {
      from { transform: scale(.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .result h2 {
      font-family: "Playfair Display", serif;
      font-size: clamp(32px, 5vw, 48px);
      margin: 12px 0;
      color: #ff1f68;
      text-shadow: 0 2px 10px rgba(255,0,80,0.35);
    }

    .flower-gif {
      width: min(400px, 92vw);
      border-radius: 12px;
      margin-top: 10px;
      box-shadow: 0 15px 45px rgba(0,0,0,.22);
    }

    /* CONFETTI CANVAS */
    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>

<body>
  <!-- FLOATING HEARTS -->
  <script>
    for (let i = 0; i < 20; i++) {
      const heart = document.createElement("div");
      heart.className = "floating-heart";
      heart.textContent = "❤";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDelay = (Math.random() * 5) + "s";
      heart.style.fontSize = (20 + Math.random() * 20) + "px";
      document.body.appendChild(heart);
    }
  </script>

  <canvas id="confettiCanvas"></canvas>

  <main class="card">
    <svg class="art" viewBox="0 0 320 240">
      <defs>
        <linearGradient id="fur" x1="0" x2="1">
          <stop offset="0" stop-color="#ffdab5"/>
          <stop offset="1" stop-color="#f4b98e"/>
        </linearGradient>
        <linearGradient id="heart" x1="0" x2="1">
          <stop offset="0" stop-color="#ff4d88"/>
          <stop offset="1" stop-color="#ff1f68"/>
        </linearGradient>
      </defs>

      <path d="M250 50 C250 33 270 25 282 38  C294 25 314 33 314 50 C314 78 282 92 282 106 C282 92 250 78 250 50Z" fill="url(#heart)"/>

      <path d="M90 120 C90 70 140 40 190 60 C240 40 290 70 290 120 C290 180 240 210 190 210 C140 210 90 180 90 120Z"
            fill="url(#fur)"/>

      <circle cx="160" cy="130" r="8"/>
      <circle cx="220" cy="130" r="8"/>

      <path d="M190 144 C186 144 182 148 182 152 C182 160 190 164 190 170 C190 164 198 160 198 152 C198 148 194 144 190 144Z"
            fill="#ff8bb5"/>
    </svg>

    <h1>Shikhaa… will you be my Valentine? 💖</h1>

    <section class="button-zone" id="zone">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </section>

    <div class="hint" id="hint">Try catching the “No” button 😉</div>

    <section class="result" id="result">
      <h2>She said YES! 🌹</h2>
      <img class="flower-gif" src="https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExM2p3M2ZyN3h3OHl3cTZ3cG56Ym5memw3ZWlmdWgwZnphc2c4YmdsYSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/g9582DNuQppxC/giphy.gif" />
    </section>
  </main>

  <script>
    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const result = document.getElementById("result");
    const hint = document.getElementById("hint");

    const confettiCanvas = document.getElementById("confettiCanvas");
    const confettiInstance = confetti.create(confettiCanvas, { resize: true });

    function fullScreenConfetti() {
      const end = Date.now() + 1500;
      (function frame() {
        confettiInstance({ particleCount: 12, spread: 80, startVelocity: 45, origin: { x: Math.random(), y: Math.random() * 0.3 } });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();

      setTimeout(() => {
        confettiInstance({ particleCount: 280, spread: 140, startVelocity: 60, origin: { x: 0.5, y: 0.55 } });
      }, 300);
    }

    let yesScale = 1;

    function growYes() {
      yesScale = Math.min(2.4, yesScale + 0.12);
      yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
    }

    function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

    function moveNo(px, py) {
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      let dx = (b.left + b.width/2) - px;
      let dy = (b.top + b.height/2) - py;
      let mag = Math.hypot(dx, dy) || 1;
      dx /= mag; dy /= mag;

      let newLeft = (b.left - z.left) + dx * 150;
      let newTop  = (b.top - z.top) + dy * 150;

      newLeft = clamp(newLeft, 0, z.width - b.width);
      newTop  = clamp(newTop, 0, z.height - b.height);

      noBtn.style.left = newLeft + "px";
      noBtn.style.top = newTop + "px";
      noBtn.style.transform = "none";

      growYes();
    }

    zone.addEventListener("pointermove", e => {
      const b = noBtn.getBoundingClientRect();
      const d = Math.hypot((b.left + b.width/2) - e.clientX, (b.top + b.height/2) - e.clientY);
      if (d < 140) moveNo(e.clientX, e.clientY);
    });

    noBtn.addEventListener("click", e => e.preventDefault());

    yesBtn.addEventListener("click", () => {
      zone.style.display = "none";
      hint.style.display = "none";
      result.style.display = "block";
      fullScreenConfetti();
    });
  </script>
</body>
</html>
